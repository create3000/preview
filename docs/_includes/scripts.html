<script type="module">
for (const element of document .querySelectorAll ("a[href='/preview/']"))
   element .setAttribute ("href", "/x_ite/");
</script>

{% if page.reference %}
<script type="module">
const hierarchy = document .querySelector ("#hierarchy + div .rouge-code pre");

hierarchy .innerHTML = hierarchy .textContent .replace (/(\w+)/sg, (match, p1) =>
{
   const a = document .querySelector (`h2[id*="${p1 .toLowerCase ()}"]`);

   return `<a href="#${a .getAttribute ("id")}">${p1}</a>`;
});

hierarchy .parentElement .classList .remove ("rouge-code");
</script>
{% endif %}

{% if content contains '<x3d-canvas' or content contains '<x3d-script-area' or page.x_ite %}

<script defer src="/preview/assets/x_ite/dist/x_ite.min.js"></script>

<script type="module">
function changeColorScheme ()
{
   const html = document .querySelector ("html");

   const darkMode = (window .matchMedia ?.("(prefers-color-scheme: dark)") .matches
      || html .getAttribute ("data-bs-theme") === "dark") && (html .getAttribute ("data-bs-theme") !== "light");

   for (const canvas of document .querySelectorAll ("x3d-canvas"))
      canvas .setAttribute ("theme", darkMode ? "dark" : "light");
}

const observer = new MutationObserver (changeColorScheme);

observer .observe (document .querySelector ("html"),
{
   attributes: true,
   attributeFilter: ["data-bs-theme"],
   attributeOldValue: false,
});

changeColorScheme ();

for (const { browser } of document .querySelectorAll ("x3d-canvas"))
{
   browser .addBrowserCallback ("check", X3D .X3DConstants .CONNECTION_ERROR, () =>
   {
      window .location .reload ();
   });
}
</script>
{% endif %}
